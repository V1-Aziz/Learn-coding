<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */
.flag{
  background-color: #CE1126;
  width: 900px;
  height: 600px;
  position: relative;

}

.flag >p{
  text-align: center;
  color: white;
  margin: 0;
  font-size: 80px;
}

.flag > div >div {

  width: 100%;
  background-color: #002868;
  height: 300px;

}

.flag > div > div >p{
  width: 200px;
  height: 200px;
  top: 50px;
  left: 350px;
  background-color: white;
  position: relative;
  border-radius: 100%;
  font-size: 80px;
  color: black;
  text-align: center;
}
    
  </style>
</head>
