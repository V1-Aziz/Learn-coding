<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    .container{
      display: grid;
      width: 748px;
      height: 748px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 22px;
      background-color: black;
      gap: 9px;
    }
    .red{
      background-color: #E72F24;
      grid-area: 1/1;
    }
    .black{
      background-color: #232629;
      grid-column-start: 3;
    }

    .yellow{
      background-color: #F9D01E;
      grid-column-start: 2;
      grid-row-start: 4;
    }

    .blue{
      background-color: #004592;
      grid-column-start: 4;
      grid-row-start: 2;
    }

    .white1{
      background-color: #F0F1EC;  
      grid-column: span 3;
    }
    
    .white2{
      background-color: #F0F1EC;
      grid-row: span 2;
    }

    .white3{
      background-color: #F0F1EC;
      grid-column: span 2;
      grid-row: span 2;

    }

    .white4{
      background-color: #F0F1EC;
      grid-column-start: 1;
      grid-row-start: 4;
    }

    .white5{
      background-color: #F0F1EC;
      grid-column-start: 4;
      grid-row-start: 3;
      grid-row: span 2;
    }
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
  </style>
</head>

<body>
  <div class="container">
    <div class="white1"></div>
    <div class="white2"></div>
    <div class="white3"></div>
    <div class="white4"></div>
    <div class="white5"></div>
    <div class="red"></div>
    <div class="black"></div>
    <div class="blue"></div>
    <div class="yellow"></div>
  </div>
</body>

</html>
